<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop Fizz | fizz5</title>
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/images/webclip.png" />
  </head>
  <body data-barba="wrapper" class="shop-page shop-layout-full">
    <div id="main" data-barba="container" data-barba-namespace="shop" class="shop-overflow">
      <div class="shop-global">
        <div class="shop-cursor" aria-hidden="true">
          <div class="shop-cursor__dot1"></div>
          <div class="shop-cursor__dot2">
            <p class="shop-cursor__text">DRAG</p>
          </div>
        </div>

        <nav class="shop-nav" aria-label="Site">
          <div class="shop-menu" id="shop-menu" hidden>
            <div class="shop-menu__background">
              <div class="shop-menu__background-fill"></div>
              <div class="shop-menu__lottie" id="shop-menu-lottie" aria-hidden="true"></div>
            </div>
            <div class="shop-menu__container">
              <div class="shop-menu__contain">
                <div class="shop-menu__left">
                  <a href="/bottles.html" class="shop-nav-link shop-nav-link--1">
                    <img
                      src="/images/categories/bottles.jpg"
                      alt=""
                      class="shop-nav-link__img"
                      loading="lazy"
                    />
                    <div class="shop-nav-link__line"></div>
                    <div class="shop-nav-link__contain">
                      <p class="shop-nav-link__text">Bottles</p>
                      <p class="shop-nav-link__num">01</p>
                    </div>
                  </a>
                  <a href="/flavors.html" class="shop-nav-link">
                    <img
                      src="/images/categories/flavors.jpg"
                      alt=""
                      class="shop-nav-link__img"
                      loading="lazy"
                    />
                    <div class="shop-nav-link__line"></div>
                    <div class="shop-nav-link__contain">
                      <p class="shop-nav-link__text">Flavors</p>
                      <p class="shop-nav-link__num">02</p>
                    </div>
                  </a>
                  <a href="/co2.html" class="shop-nav-link shop-nav-link--3">
                    <img
                      src="/images/categories/co2-refills.jpg"
                      alt=""
                      class="shop-nav-link__img"
                      loading="lazy"
                    />
                    <div class="shop-nav-link__line"></div>
                    <div class="shop-nav-link__contain">
                      <p class="shop-nav-link__text">CO₂ Refills</p>
                      <p class="shop-nav-link__num">03</p>
                    </div>
                  </a>
                </div>
                <div class="shop-menu__right">
                  <img
                    src="/images/shop/menu-graphic.svg"
                    alt=""
                    class="shop-menu__icon"
                    loading="lazy"
                  />
                  <div class="shop-sublinks">
                    <a href="/" class="shop-sublink">
                      <div class="shop-sublink__contain">
                        <p class="shop-sublink__text">Home</p>
                        <div class="shop-sublink__line"></div>
                      </div>
                    </a>
                    <a href="/explore.html" class="shop-sublink">
                      <div class="shop-sublink__contain">
                        <p class="shop-sublink__text">Explore</p>
                        <div class="shop-sublink__line"></div>
                      </div>
                    </a>
                    <a href="/features.html" class="shop-sublink">
                      <div class="shop-sublink__contain">
                        <p class="shop-sublink__text">Features</p>
                        <div class="shop-sublink__line"></div>
                      </div>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="shop-nav__bar">
            <a href="/" class="shop-nav__logo fizz-heading">FIZZ5</a>
            <button
              type="button"
              class="shop-trigger"
              id="shop-menu-trigger"
              aria-expanded="false"
              aria-controls="shop-menu"
              aria-label="Open menu"
            >
              <span class="shop-trigger__circle" aria-hidden="true"></span>
              <span class="shop-trigger__line shop-trigger__line--1" aria-hidden="true"></span>
              <span class="shop-trigger__line shop-trigger__line--2" aria-hidden="true"></span>
            </button>
          </div>
        </nav>
      </div>

      <main class="shop-main">
        <section class="shop-hero" aria-labelledby="shop-hero-heading">
          <div class="shop-hero__container">
            <div class="shop-hero__wrap">
              <h1 id="shop-hero-heading" class="shop-hero__title fizz-heading">
                Shop everything for Fizz
              </h1>
              <p class="shop-hero__lead fizz-lead">
                Bottles, flavors, and refills—everything you need to keep the bubbles going.
              </p>
            </div>
          </div>
        </section>

        <section class="shop-hero-slider shop-slider-chrome" aria-label="Shop categories">
          <div class="shop-container-slider">
            <div class="shop-slider-wave shop-slider-wave--top" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 804 50.167"
                aria-hidden="true"
              >
              <path
                fill="currentColor"
                d="M804,0v16.671c0,0-204.974,33.496-401.995,33.496C204.974,50.167,0,16.671,0,16.671V0H804z"
              />
            </svg>
          </div>

          <div class="shop-splide splide" id="shop-category-splide" data-category-splide="shop">
              <div class="splide__track">
                <ul class="splide__list"></ul>
              </div>
            </div>
          </div>

          <div class="shop-slider-wave shop-slider-wave--bottom" aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 804 50.167"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M804,0v16.671c0,0-204.974,33.496-401.995,33.496C204.974,50.167,0,16.671,0,16.671V0H804z"
              />
            </svg>
          </div>

          <div class="shop-controls">
            <button type="button" class="shop-control shop-control--prev" aria-label="Previous slide">
              <span class="shop-control__fill" aria-hidden="true"></span>
              <span class="shop-control__arrow" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 18">
                  <path
                    fill="currentColor"
                    d="M23.999,8H5.481c5.009-2.91,6.349-7.311,6.416-7.548L9.976-0.102C9.9,0.156,8.03,6.213-0.073,8.024L0.146,9l-0.218,0.976C8.03,11.787,9.9,17.844,9.976,18.101l1.922-0.554C11.83,17.31,10.49,12.91,5.481,10h18.518V8z"
                  />
                </svg>
              </span>
            </button>
            <button type="button" class="shop-control shop-control--next" aria-label="Next slide">
              <span class="shop-control__fill" aria-hidden="true"></span>
              <span class="shop-control__arrow shop-control__arrow--flipped" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 18">
                  <path
                    fill="currentColor"
                    d="M23.999,8H5.481c5.009-2.91,6.349-7.311,6.416-7.548L9.976-0.102C9.9,0.156,8.03,6.213-0.073,8.024L0.146,9l-0.218,0.976C8.03,11.787,9.9,17.844,9.976,18.101l1.922-0.554C11.83,17.31,10.49,12.91,5.481,10h18.518V8z"
                  />
                </svg>
              </span>
            </button>
          </div>
        </section>
      </main>
    </div>

    <div id="lottie-overlay" aria-hidden="true">
      <div id="lottie-overlay-canvas"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
