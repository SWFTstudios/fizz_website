name: Preview fizz-final

on:
  pull_request:

concurrency:
  group: preview-fizz-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Upload Workers preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upload Worker preview version
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- fizz-final-workers-preview -->';
            const output = process.env.WRANGLER_OUTPUT || '';
            const fromOutput = (output.match(/Version Preview URL:\s*(https:\/\/\S+)/) || [])[1];
            const url = fromOutput || process.env.DEPLOYMENT_URL || '';
            if (!url) {
              core.setFailed('Preview upload succeeded but no Version Preview URL was found in wrangler output.');
              return;
            }

            const body = [
              marker,
              '## Workers preview',
              '',
              `[${url}](${url})`,
              '',
              'Uploaded with `wrangler versions upload` (GitHub Actions).',
              'If the Cloudflare dashboard **Workers Builds** check is red, that is separate from this preview URL.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
            core.info(`Preview URL: ${url}`);
